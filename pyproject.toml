[project]
name = "derail"
version = "0.1.0"
description = "YAML-driven MCP scenario harness for benchmarking prompt-injection attacks and inline-classifier defenses against LLM agents."
requires-python = ">= 3.10"
dependencies = [
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "mcp>=1.0.0",
    "mcp-agent>=0.1.1",
    "openai>=1.99.0",
    "openevolve==0.2.27",
    "pydantic>=2.7.1",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
    "typer>=0.12.0",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [
    "prompt injection",
    "mcp",
    "benchmark",
    "llms",
    "security",
]

[project.scripts]
derail = "derail.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.3.0",
    "pyright>=1.1.362",
    "types-pyyaml>=6.0.12.20240311",
]

[tool.uv]
managed = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["derail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = []
select = [
    "F",   # pyflakes
    "UP",  # pyupgrade
    "I",   # isort
    "ERA", # eradicate
    "N",   # pep8-naming
    "RUF",
]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
